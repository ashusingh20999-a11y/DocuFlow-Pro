<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Tools · DocuFlow Pro</title><link rel="stylesheet" href="/static/style.css"></head><body>
<nav class="nav"><a class="logo" href="/">Docu<span>Flow</span> Pro</a><a class="btn" href="/">Home</a></nav>
<div class="container"><div class="section-title"><h1>All Document Tools</h1><p class="muted">Choose a tool, upload your file and download the result.</p></div>
<div class="workspace">
<label class="upload"><input id="file" type="file" multiple accept=".pdf,.docx,.xlsx,.xls,.csv,.jpg,.jpeg,.png"><div class="drop-title" id="name">📁 Choose file(s)</div><p class="muted">Drag & drop or tap to browse</p></label>
<div class="select"><select id="target">
<option value="pdf">Word / Excel / CSV → PDF</option><option value="docx">PDF → Word</option><option value="xlsx">PDF → Excel</option><option value="xlsx">CSV → Excel</option><option value="csv">Excel → CSV</option><option value="merge_pdf">Merge PDFs</option><option value="split_pdf">Split PDF</option><option value="image_pdf">Images → PDF</option><option value="jpg">PDF → Images (ZIP)</option>
</select></div><button class="btn" id="go" style="width:100%">Convert & Download</button><div class="status" id="status"></div></div>
<div style="height:30px"></div><div class="tools">
<div class="tool"><div class="icon">📄</div><h3>PDF Tools</h3><p class="muted">Convert, merge, split and export pages.</p></div>
<div class="tool"><div class="icon">📝</div><h3>Office Tools</h3><p class="muted">Word and spreadsheet conversion.</p></div>
<div class="tool"><div class="icon">🖼️</div><h3>Image Tools</h3><p class="muted">Images to PDF and PDF pages to images.</p></div>
</div></div>
<script>
const f=document.getElementById('file'),n=document.getElementById('name'),s=document.getElementById('status'),go=document.getElementById('go'),target=document.getElementById('target');
f.onchange=()=>n.textContent=f.files.length?(f.files.length+' file(s) selected'):'📁 Choose file(s)';
function outputName(){const t=target.value; if(t==='docx')return 'converted.docx'; if(t==='xlsx')return 'converted.xlsx'; if(t==='csv')return 'converted.csv'; if(t==='merge_pdf')return 'merged.pdf'; if(t==='split_pdf')return 'split_pages.zip'; if(t==='image_pdf')return 'images.pdf'; if(t==='jpg')return 'pdf_images.zip'; return 'converted.pdf';}
go.onclick=async()=>{
 if(!f.files.length){s.textContent='Please choose a file.';return}
 const fd=new FormData(); for(const x of f.files)fd.append('files',x); fd.append('target',target.value);
 go.disabled=true; go.textContent='Processing…'; s.textContent='Uploading and converting. Please wait…';
 try{
   const r=await fetch('/convert',{method:'POST',body:fd});
   const type=r.headers.get('content-type')||'';
   if(!r.ok){let msg='Conversion failed.'; if(type.includes('application/json')){const j=await r.json();msg=j.detail||msg}else{msg=(await r.text()).slice(0,300)||msg} throw new Error(msg)}
   const b=await r.blob(); if(!b.size)throw new Error('Server returned an empty file.');
   const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=outputName();a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},1500);
   s.textContent='✓ Conversion complete. File downloaded as '+outputName();
 }catch(e){s.textContent=e.name==='TypeError'?'✕ Server connection failed. Please wait for Render deployment and try again.':'✕ '+e.message}
 finally{go.disabled=false;go.textContent='Convert & Download'}
};
</script></body></html>
